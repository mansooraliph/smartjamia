# ─────────────────────────────────────────────────────────────────────────────
# EduPro — nginx site config
#
#   1. Edit `server_name` and the `root` path below.
#   2. sudo ln -s /var/www/edupro/nginx-edupro.conf /etc/nginx/sites-enabled/edupro
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. sudo certbot --nginx -d app.yourdomain.com
#      (Certbot rewrites this file to add the listen 443 server + HTTP→HTTPS redirect.)
#
# One domain serves the whole SPA — marketing (/), school app (/dashboard…),
# student/parent portal (/portal), superadmin (/superadmin) — and proxies the API.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name app.yourdomain.com;            # <-- CHANGE

    # Built SPA — output of `npm run build:frontend`
    root /var/www/edupro/frontend/dist;        # <-- CHANGE if the repo lives elsewhere
    index index.html;

    client_max_body_size 25M;                  # student/staff imports + photo uploads

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed Vite assets — safe to cache forever
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API — the backend's global prefix is /api/v1. This also covers the
    # Razorpay webhook (/api/v1/public/razorpay/webhook); nginx forwards the
    # raw request body unchanged, which the signature check needs.
    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;               # PDF generation can take a while
    }

    # Uploaded files + generated PDFs (report cards, TCs, receipts) — served
    # by the backend from STORAGE_LOCAL_PATH at the /uploads prefix.
    location /uploads/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
    }

    # (Optional) Lock down API docs in production — uncomment to disable:
    # location = /api/docs { return 404; }
    # location /api/docs/ { return 404; }

    # SPA fallback — every other path returns index.html for React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
